kind = "web"
previewPath = "/"
title = "Urban Water and Sanitation Service Optimization - Digital Transformation - Business Plan Studio"
description = "Water utility business and investment planning: secure utility registry, portfolio oversight, and playbook progress."
version = "1.0.0"
id = "artifacts/bp-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20576

[services.development]
run = "pnpm --filter @workspace/bp-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bp-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/bp-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20576"
BASE_PATH = "/"
