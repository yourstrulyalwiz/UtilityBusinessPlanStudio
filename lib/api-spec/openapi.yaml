  "components": {
    "schemas": {
      "TestRoleInput": {
        "type": "object",
        "required": ["role"],
        "properties": {"role": {"type": "string", "enum": ["admin", "ttl", "editor", "viewer"]}}
      },
      "HealthStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      },
      "AuthUser": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "email": {
            "type": [
              "string",
              "null"
            ]
          },
          "firstName": {
            "type": [
              "string",
              "null"
            ]
          },
          "lastName": {
            "type": [
              "string",
              "null"
            ]
          },
          "profileImageUrl": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "id",
          "email",
          "firstName",
          "lastName",
          "profileImageUrl"
        ]
      },
      "AuthUserEnvelope": {
        "type": "object",
        "properties": {
          "user": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/AuthUser"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "user"
        ]
      },
      "MobileTokenExchangeRequest": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "code_verifier": {
            "type": "string"
          },
          "redirect_uri": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "nonce": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "code_verifier",
          "redirect_uri",
          "state"
        ]
      },
      "MobileTokenExchangeSuccess": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          }
        },
        "required": [
          "token"
        ]
      },
      "LogoutSuccess": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "const": true
          }
        },
        "required": [
          "success"
        ]
      },
      "ErrorEnvelope": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "Person": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "fullName": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "ttl",
              "editor",
              "viewer"
            ]
          },
          "organization": {
            "type": "string"
          },
          "isActive": {
            "type": "boolean"
          },
          "invited": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "fullName",
          "email",
          "role",
          "organization",
          "isActive",
          "invited"
        ]
      },
      "Profile": {
        "type": "object",
        "properties": {
          "person": {
            "$ref": "#/components/schemas/Person"
          },
          "setupRequired": {
            "type": "boolean"
          },
          "canBootstrap": {
            "type": "boolean"
          }
        },
        "required": [
          "person",
          "setupRequired",
          "canBootstrap"
        ]
      },
      "PersonInput": {
        "type": "object",
        "properties": {
          "fullName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "ttl",
              "editor",
              "viewer"
            ]
          },
          "organization": {
            "type": "string"
          }
        },
        "required": [
          "fullName",
          "email",
          "role"
        ]
      },
      "PersonUpdate": {
        "type": "object",
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "ttl",
              "editor",
              "viewer"
            ]
          },
          "isActive": {
            "type": "boolean"
          }
        },
        "required": []
      },
      "Country": {
        "type": "object",
        "properties": {
          "iso3": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "region": {
            "type": "string"
          },
          "currencyCode": {
            "type": "string"
          }
        },
        "required": [
          "iso3",
          "name",
          "region",
          "currencyCode"
        ]
      },
      "Metadata": {
        "type": "object",
        "properties": {
          "countries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Country"
            }
          },
          "countrySource": {
            "type": "string"
          },
          "phases": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Phase"
            }
          },
          "activities": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Activity"
            }
          }
        },
        "required": [
          "countries",
          "countrySource",
          "phases",
          "activities"
        ]
      },
      "Phase": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "days": {
            "type": "number"
          }
        },
        "required": [
